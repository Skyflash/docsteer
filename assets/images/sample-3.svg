<!-- width/height are explicit on purpose: an SVG with only a viewBox has no
     intrinsic size, and the lightbox would open it at the browser's 300x150
     default instead of full size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"
     viewBox="0 0 1200 700" role="img" aria-label="Sample figure 3, mint skin">
  <title>Figure 3 — mint</title>
  <defs>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b8069"/>
      <stop offset="1" stop-color="#21c8a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#s3)"/>
  <text x="600" y="368" text-anchor="middle" fill="#ffffff"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="96" font-weight="700" letter-spacing="-2">Figure 3</text>
  <text x="600" y="428" text-anchor="middle" fill="#ffffff" opacity=".85"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="30" font-weight="500">mint skin</text>
</svg>
