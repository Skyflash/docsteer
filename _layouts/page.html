---
layout: default
---
<article class="prose doc-content{% if page.wide %} is-wide{% endif %}">
  {% if page.title %}
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-head__lead">{{ page.description }}</p>{% endif %}
  </header>
  {% endif %}

  {{ content }}
</article>
